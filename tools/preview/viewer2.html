<!doctype html><meta charset="utf-8"><title>Living Tides - preview viewer v2 (raw WebGL2, NOT the game engine)</title>
<style>html,body{margin:0;background:#222;overflow:hidden}canvas{display:block}</style><canvas id="c"></canvas>
<script>
// Minimal raw-WebGL2 GLB viewer written for the Living Tides pipeline test. No third-party libraries.
const q=new URLSearchParams(location.search), num=(k,d)=>q.has(k)?parseFloat(q.get(k)):d;
const W=num('w',1400),H=num('h',1400),mode=q.get('mode')||'day';
const cv=document.getElementById('c');cv.width=W;cv.height=H;
const gl=cv.getContext('webgl2',{antialias:true,preserveDrawingBuffer:true});
const MODES={
 day:{L:[-0.42,0.78,0.46],key:[3.1,2.85,2.5],fillDir:[0.75,0.35,-0.3],fill:[0.42,0.5,0.66],sky:[0.62,0.7,0.86],gnd:[0.4,0.33,0.3],floor:[0.62,0.6,0.66],em:0,exp:1.0,pl:0},
 sunset:{L:[-0.8,0.3,0.36],key:[3.6,1.7,0.85],fillDir:[0.7,0.4,-0.3],fill:[0.3,0.26,0.5],sky:[0.5,0.38,0.6],gnd:[0.38,0.24,0.22],floor:[0.6,0.47,0.5],em:1.6,exp:1.0,pl:0.5},
 night:{L:[0.35,0.8,0.45],key:[0.2,0.3,0.56],fillDir:[-0.6,0.4,-0.3],fill:[0.04,0.06,0.13],sky:[0.07,0.1,0.2],gnd:[0.03,0.03,0.06],floor:[0.16,0.18,0.3],em:3.2,exp:1.25,pl:1}}[mode];
const norm=v=>{const l=Math.hypot(...v);return v.map(x=>x/l)},sub=(a,b)=>a.map((x,i)=>x-b[i]),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function lookAt(e,t,up){const f=norm(sub(t,e)),s=norm(cross(f,up)),u=cross(s,f);return [s[0],u[0],-f[0],0,s[1],u[1],-f[1],0,s[2],u[2],-f[2],0,-dot(s,e),-dot(u,e),dot(f,e),1]}
function ortho(l,r,b,t,n,f){return [2/(r-l),0,0,0,0,2/(t-b),0,0,0,0,-2/(f-n),0,-(r+l)/(r-l),-(t+b)/(t-b),-(f+n)/(f-n),1]}
function mul(a,b){const o=new Array(16).fill(0);for(let c=0;c<4;c++)for(let r=0;r<4;r++)for(let k=0;k<4;k++)o[c*4+r]+=a[k*4+r]*b[c*4+k];return o}
const VS=`#version 300 es
layout(location=0) in vec3 aP;layout(location=1) in vec3 aC;uniform mat4 uVP;out vec3 vW;out vec3 vC;void main(){vW=aP;vC=aC;gl_Position=uVP*vec4(aP,1.);}`;
const FSD=`#version 300 es
precision highp float;void main(){}`;
const FS=`#version 300 es
precision highp float;in vec3 vW;in vec3 vC;out vec4 o;
uniform highp sampler2D uSh,uTop;uniform mat4 uLVP,uTVP;
uniform vec3 uL,uKey,uFillDir,uFill,uSky,uGnd,uView,uEmCol,uFloor,uCen;uniform float uEm,uExp,uIsFloor,uPLOn;
uniform vec4 uPL[16];uniform vec3 uPLc[16];uniform int uNPL;uniform vec2 uRes;uniform float uRad,uAo1,uAo2,uBias,uNOff,uDesat,uUnlit;
const vec2 P[16]=vec2[16](vec2(-0.94,-0.4),vec2(0.95,-0.77),vec2(-0.09,-0.93),vec2(0.34,0.29),vec2(-0.92,0.46),vec2(-0.82,-0.88),vec2(-0.38,0.28),vec2(0.97,0.76),vec2(0.44,-0.98),vec2(0.54,0.06),vec2(-0.26,-0.42),vec2(0.79,0.19),vec2(-0.24,1.0),vec2(-0.81,0.91),vec2(0.02,0.39),vec2(0.14,-0.14));
float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
float shd(highp sampler2D s,mat4 m,vec3 p,float rad,float bias){
  vec4 c=m*vec4(p,1.);vec3 u=c.xyz*.5+.5;if(u.x<0.||u.y<0.||u.x>1.||u.y>1.||u.z>1.)return 1.;
  float an=hash(gl_FragCoord.xy)*6.2832;mat2 r=mat2(cos(an),-sin(an),sin(an),cos(an));float a=0.;
  for(int i=0;i<16;i++){float d=texture(s,u.xy+r*P[i]*rad).r;a+=(u.z-bias>d)?0.:1.;}return a/16.;}
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){
  vec3 n=normalize(cross(dFdx(vW),dFdy(vW)));if(dot(n,uView)<0.)n=-n;
  vec3 alb=mix(vC,uFloor,uIsFloor);
  if(uUnlit>0.5){o=vec4(pow(vC,vec3(1./2.2)),1.);return;}
  alb=mix(alb,vec3(dot(alb,vec3(.3,.5,.2)))*0.75+0.2,uDesat);
  vec3 pp=vW+n*uNOff;
  float s=shd(uSh,uLVP,pp,uRad,uBias);
  float ao=shd(uTop,uTVP,vW+n*0.15,uAo1,uBias*2.);
  float ao2=shd(uTop,uTVP,vW+n*0.15,uAo2,uBias*2.);
  float occ=mix(0.42,1.,ao*0.55+ao2*0.45);
  vec3 amb=mix(uGnd,uSky,n.y*.5+.5)*occ;
  vec3 lit=amb+uKey*max(dot(n,uL),0.)*s+uFill*max(dot(n,uFillDir),0.)*mix(0.6,1.,occ);
  for(int i=0;i<16;i++){if(i>=uNPL)break;vec3 d=uPL[i].xyz-vW;float r=length(d);float at=pow(clamp(1.-r/uPL[i].w,0.,1.),2.);
    lit+=uPLc[i]*uPLOn*at*max(dot(n,d/r)*.75+.25,0.);}
  vec3 c=alb*lit+uEmCol*uEm;
  c=aces(c*uExp);c=pow(c,vec3(1./2.2));
  vec2 v=gl_FragCoord.xy/uRes-.5;c*=1.-0.38*smoothstep(0.35,0.85,length(v));
  o=vec4(c,1.);}`;
function prog(vs,fs){const p=gl.createProgram();for(const [t,s] of [[gl.VERTEX_SHADER,vs],[gl.FRAGMENT_SHADER,fs]]){const sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(sh));gl.attachShader(p,sh)}gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p}
function depthTarget(sz){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.texStorage2D(gl.TEXTURE_2D,1,gl.DEPTH_COMPONENT32F,sz,sz);
  for(const k of [gl.TEXTURE_MIN_FILTER,gl.TEXTURE_MAG_FILTER])gl.texParameteri(gl.TEXTURE_2D,k,gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  const f=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,f);gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.TEXTURE_2D,t,0);gl.drawBuffers([gl.NONE]);gl.readBuffer(gl.NONE);
  if(gl.checkFramebufferStatus(gl.FRAMEBUFFER)!==gl.FRAMEBUFFER_COMPLETE)throw new Error('fbo');return {t,f,sz}}
async function main(){
  const objs=[],lights=[];let tris=0;
  for(const url of q.get('glb').split(',')){
  const buf=await (await fetch(url)).arrayBuffer(),dv=new DataView(buf);
  if(dv.getUint32(0,true)!==0x46546C67)throw new Error('not glb');
  const jl=dv.getUint32(12,true),json=JSON.parse(new TextDecoder().decode(new Uint8Array(buf,20,jl))),binOff=20+jl+8;
  const acc=i=>{const a=json.accessors[i],v=json.bufferViews[a.bufferView];return new Float32Array(buf.slice(binOff+v.byteOffset,binOff+v.byteOffset+v.byteLength))};
  for(const nd of json.nodes){const pr=json.meshes[nd.mesh].primitives[0],P=acc(pr.attributes.POSITION),Cc=acc(pr.attributes.COLOR_0);
    const vao=gl.createVertexArray();gl.bindVertexArray(vao);
    for(const [loc,arr] of [[0,P],[1,Cc]]){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0)}
    const ex=nd.extras||{};objs.push({name:nd.name,vao,n:P.length/3,em:ex.emissive||null,unlit:!!ex.unlit});tris+=P.length/9;
    if(ex.light){const a=json.accessors[pr.attributes.POSITION],off=ex.light.offset||[0,0,0];lights.push({p:a.min.map((m,i)=>(m+a.max[i])/2+off[i]),r:ex.light.range,c:ex.light.color.map(x=>x*ex.light.intensity)})}}}
  lights.length=Math.min(lights.length,16);
  // floor quad
  const fv=gl.createVertexArray();gl.bindVertexArray(fv);const F=900,fy=num('floor',-0.98);
  for(const [loc,arr] of [[0,new Float32Array([-F,fy,-F,F,fy,-F,F,fy,F,-F,fy,-F,F,fy,F,-F,fy,F])],[1,new Float32Array(18)]]){const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,arr,gl.STATIC_DRAW);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,3,gl.FLOAT,false,0,0)}
  const pm=prog(VS,FS),pd=prog(VS,FSD),U=n=>gl.getUniformLocation(pm,n);
  const EXT=num('ext',15),cen=[num('cx',1),num('cy',1.2),num('cz',1)],L=norm(MODES.L);
  const lvp=d=>mul(ortho(-EXT,EXT,-EXT,EXT,1,EXT*6+1),lookAt(cen.map((c,i)=>c+d[i]*EXT*3),cen,Math.abs(d[1])>0.99?[0,0,-1]:[0,1,0]));
  const LVP=lvp(L),TVP=lvp([0.02,1,0.02].map((x,i,a)=>x/Math.hypot(...a)));
  const sh=depthTarget(4096),top=depthTarget(2048);
  const yaw=num('yaw',45)*Math.PI/180,pitch=num('pitch',33)*Math.PI/180,zoom=num('zoom',10.5),tgt=[num('tx',1.0),num('ty',1.4),num('tz',1.0)];
  const vd=[Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch)];
  const VP=mul(ortho(-zoom*W/H,zoom*W/H,-zoom,zoom,1,900),lookAt(tgt.map((c,i)=>c+vd[i]*400),tgt,[0,1,0]));const DES=num('desat',0);
  gl.enable(gl.DEPTH_TEST);
  function frame(){
    for(const [tg,m] of [[sh,LVP],[top,TVP]]){gl.bindFramebuffer(gl.FRAMEBUFFER,tg.f);gl.viewport(0,0,tg.sz,tg.sz);gl.clear(gl.DEPTH_BUFFER_BIT);gl.useProgram(pd);
      gl.uniformMatrix4fv(gl.getUniformLocation(pd,'uVP'),false,m);for(const o of objs){if(o.unlit||(o.name==='seabirds'&&tg===top))continue;gl.bindVertexArray(o.vao);gl.drawArrays(gl.TRIANGLES,0,o.n)}}
    gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(pm);
    gl.uniformMatrix4fv(U('uVP'),false,VP);gl.uniformMatrix4fv(U('uLVP'),false,LVP);gl.uniformMatrix4fv(U('uTVP'),false,TVP);
    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,sh.t);gl.uniform1i(U('uSh'),0);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,top.t);gl.uniform1i(U('uTop'),1);
    gl.uniform3fv(U('uL'),L);gl.uniform3fv(U('uKey'),MODES.key);gl.uniform3fv(U('uFillDir'),norm(MODES.fillDir));gl.uniform3fv(U('uFill'),MODES.fill);gl.uniform3fv(U('uSky'),MODES.sky);gl.uniform3fv(U('uGnd'),MODES.gnd);
    gl.uniform3fv(U('uView'),vd);gl.uniform3fv(U('uFloor'),MODES.floor);gl.uniform1f(U('uExp'),MODES.exp);gl.uniform2f(U('uRes'),W,H);gl.uniform1f(U('uPLOn'),MODES.pl);
    gl.uniform1f(U('uRad'),0.16/(2*EXT));gl.uniform1f(U('uAo1'),0.5/(2*EXT));gl.uniform1f(U('uAo2'),1.5/(2*EXT));gl.uniform1f(U('uBias'),0.12/(EXT*6));gl.uniform1f(U('uNOff'),Math.max(0.05,2.5*2*EXT/4096));gl.uniform1f(U('uDesat'),DES);gl.uniform1f(U('uUnlit'),0);gl.uniform1i(U('uNPL'),lights.length);lights.forEach((l,i)=>{gl.uniform4f(U(`uPL[${i}]`),...l.p,l.r);gl.uniform3fv(U(`uPLc[${i}]`),l.c)});
    let dc=0;
    for(const o of objs){if(o.unlit)continue;gl.uniform1f(U('uIsFloor'),0);gl.uniform1f(U('uEm'),o.em?MODES.em:0);gl.uniform3fv(U('uEmCol'),o.em||[0,0,0]);gl.bindVertexArray(o.vao);gl.drawArrays(gl.TRIANGLES,0,o.n);dc++}
    gl.uniform1f(U('uIsFloor'),1);gl.uniform1f(U('uEm'),0);gl.bindVertexArray(fv);gl.drawArrays(gl.TRIANGLES,0,6);
    gl.disable(gl.DEPTH_TEST);gl.uniform1f(U('uIsFloor'),0);gl.uniform1f(U('uUnlit'),1);for(const o of objs){if(!o.unlit)continue;gl.bindVertexArray(o.vao);gl.drawArrays(gl.TRIANGLES,0,o.n);dc++}gl.enable(gl.DEPTH_TEST);return dc+1}
  let dc=frame();gl.finish();
  const dbg=gl.getExtension('WEBGL_debug_renderer_info');
  window.__stats={objects:objs.length,triangles:tris,drawCalls:dc,lights:lights.length,renderer:dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):'?',glError:gl.getError(),mode,size:[W,H]};
  window.__done=true}
main().catch(e=>{window.__err=String(e.stack||e);window.__done=true});
</script>
